name: Release

# Cada tag vX.Y.Z publica el instalador de Windows en GitHub Releases, solo si pasa el CI y si
# el tag coincide con la versión de package.json. El despliegue de la web no depende de esto.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el tag coincide con package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión v$version de package.json."
            exit 1
          fi

  ci:
    name: ci
    needs: version
    uses: ./.github/workflows/ci.yml
    # ci.yml declara el job de deploy (que en un tag no corre), así que necesita estos permisos.
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    name: release
    needs: [version, ci]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder --win nsis --publish never
      - name: Notas de la versión desde el CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # La sección "## [X.Y.Z] - fecha" hasta la siguiente "## [".
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "notes=release-notes.md" >> "$GITHUB_ENV"
          fi
      - name: Publicar en GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${notes:-}" ]; then
            gh release create "$GITHUB_REF_NAME" release/*.exe --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/*.exe --title "$GITHUB_REF_NAME" --generate-notes
          fi
